{% comment %}
  Upvote Button
  Displays an upvote button with count for blog posts.
  Uses Firebase to store upvote counts and localStorage to track upvote state (toggleable).
{% endcomment %}

<span class="post-meta upvote-wrapper">
  <span class="d-none d-md-inline middot">&middot;</span>
  <button class="upvote-button" id="upvote-btn" data-post-url="{{ page.url }}" aria-label="Upvote this post">
    <svg class="upvote-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L4 10h3v10h10V10h3L12 2z"/>
    </svg>
  </button>
  <span class="upvote-count" id="upvote-count">0</span>
</span>
