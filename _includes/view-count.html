{% comment %}
  View Count Display
  This include displays the view count for the current post/page.
  Make sure Firebase is configured in view-counter.js and Firebase SDK is loaded.
{% endcomment %}

<span class="post-meta view-count" style="display: none;">
  <span class="d-none d-md-inline middot">&middot;</span>
  <span class="view-count-text">Loading views...</span>
</span>
